<!doctype html><html lang='uz'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Login | AI OS</title><link rel='preconnect' href='https://fonts.googleapis.com'><link rel='preconnect' href='https://fonts.gstatic.com' crossorigin><link href='https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap' rel='stylesheet'><link rel='stylesheet' href='/styles.css'></head>
<body><div class='top'><div class='brand'>AI Business OS</div></div><div class='wrap'><div class='card' style='max-width:520px;margin:auto'>
<h2>Platformaga kirish</h2><small>Demo: admin/manager/worker/customer</small>
<div class='row'><input id='email' placeholder='email'><input id='password' type='password' placeholder='password'></div>
<button onclick='login()'>Login</button><p id='msg'></p>
</div></div>
<script>
async function login(){
  const res = await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})}).then(r=>r.json());
  if(!res.ok){msg.textContent=res.error;return;}
  localStorage.setItem('token',res.token); localStorage.setItem('user',JSON.stringify(res.user));
  location.href='/' + (res.user.role==='admin'?'admin':res.user.role);
}
</script></body></html>
